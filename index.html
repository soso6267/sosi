efore{animation-delay:0.29s}.burst:nth-child(35){left:38%;top:69%;transform:scale(.48)}.burst:nth-child(35):before{animation-delay:0.58s}.burst:nth-child(36){left:62%;top:69%;transform:scale(.38)}.burst:nth-child(36):before{animation-delay:0.87s}.burst:nth-child(37){left:72%;top:66%;transform:scale(.55)}.burst:nth-child(37):before{animation-delay:1.16s}.burst:nth-child(38){left:33%;top:40%;transform:scale(.48)}.burst:nth-child(38):before{animation-delay:1.45s}.burst:nth-child(39){left:67%;top:40%;transform:scale(.38)}.burst:nth-child(39):before{animation-delay:1.74s}.burst:nth-child(40){left:33%;top:60%;transform:scale(.55)}.burst:nth-child(40):before{animation-delay:0s}.burst:nth-child(41){left:67%;top:60%;transform:scale(.48)}.burst:nth-child(41):before{animation-delay:0.29s}.intro-title{position:relative;z-index:1}
.panel{position:relative;z-index:1;width:min(92vw,620px);min-height:340px;display:grid;place-items:center;text-align:center;padding:30px 22px;animation:arrive .8s both}
.page{position:absolute;inset:0;display:grid;place-items:center;opacity:0;visibility:hidden;transition:opacity .8s ease,visibility .8s;pointer-events:none}.page.active{opacity:1;visibility:visible;pointer-events:auto}
.intro-title{font-size:clamp(2.1rem,9vw,4.5rem);font-weight:700;line-height:1.1;color:#d86e91;text-shadow:0 3px 0 #fff,0 8px 24px #e7a3bb66;animation:titlePop 1s both}.intro-title .spark{display:block;font-family:system-ui,sans-serif;font-size:.42em;letter-spacing:.3em;margin-top:18px;color:#e79ab2}

.pocket{position:absolute;inset:0;background:#ed86a5;clip-path:polygon(0 100%,0 31%,50% 72%,100% 31%,100% 100%);z-index:4;border-radius:0 0 8px 8px}

.envelope.open .flap{transform:rotateX(180deg);z-index:1}.envelope.open .seal{opacity:0}
.hint{font:600 12px system-ui,sans-serif;letter-spacing:.11em;color:#cb7890;margin-top:18px}.env-caption{font-size:clamp(1.5rem,5vw,2rem);color:#d46d8d;margin:0 0 22px}
#replay{position:fixed;z-index:8;bottom:18px;left:50%;transform:translateX(-50%);border:1px solid #e8a5b9;background:#ffffffb8;color:#bd6681;border-radius:30px;padding:9px 17px;font:600 12px system-ui;cursor:pointer;opacity:0;visibility:hidden;transition:.3s}
body.done #replay{opacity:1;visibility:visible}
@keyframes cakeFlicker{to{transform:scale(.82,1.12) rotate(5deg);filter:brightness(1.2)}}@keyframes candleSway{50%{transform:rotate(2deg) translateY(-2px)}}@keyframes flameFlicker{to{transform:rotate(8deg) scale(.9,1.12);filter:brightness(1.15)}}@keyframes kissFly{0%{opacity:0;transform:translate(-50%,20px) scale(.35) rotate(-15deg)}22%{opacity:1}72%{opacity:1;transform:translate(-50%,-58px) scale(1.25) rotate(8deg)}100%{opacity:0;transform:translate(-50%,-105px) scale(1.55) rotate(14deg)}}@keyframes flowerRise{0%{transform:translate3d(0,0,0) rotate(0);opacity:0}12%{opacity:.5}88%{opacity:.45}100%{transform:translate3d(32px,-115svh,0) rotate(250deg);opacity:0}}@keyframes burst{0%{transform:scale(.15);opacity:0}12%{opacity:1}70%{opacity:.95}100%{transform:scale(1.7);opacity:0}}@keyframes arrive{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}@keyframes titlePop{from{opacity:0;transform:scale(.82)}to{opacity:1;transform:scale(1)}}

<main class="stage">

    <div class="page" id="gift"><div class="env-wrap"><div class="candle" aria-hidden="true"><i class="flame"></i><i class="candle-body"></i></div><h1 class="env-caption">A little surprise for you</h1><button class="envelope" id="envelope" aria-label="Open the envelope"><span class="env-back"></span><span class="letter"><span class="letter-inner"><span class="kitty-scene"><img class="kitty" src="hello-kitty.png" alt="Hello Kitty holding three balloons"><svg class="mini-cake" viewBox="0 0 44 40" role="img" aria-label="A small cake with a candle"><path d="M22 4c-4 4-2 7 0 8 3-2 4-5 0-8Z" fill="#ffb43b" class="cake-flame"/><path d="M21 12h2v8h-2z" fill="#f5d775"/><path d="M7 21q0-4 4-4h22q4 0 4 4v12H7z" fill="#f39ab5" stroke="#c65d7e" stroke-width="1.5"/><path d="M7 22q4 4 8 0 4 4 8 0 4 4 8 0 3 3 6 0v5H7z" fill="#fff5f8" stroke="#c65d7e" stroke-width="1"/><path d="M7 33q15 4 30 0v3H7z" fill="#df7192"/><circle cx="15" cy="30" r="1.2" fill="#fff2ae"/><circle cx="23" cy="31" r="1.2" fill="#fff2ae"/><circle cx="31" cy="30" r="1.2" fill="#fff2ae"/></svg></span><span class="letter-copy"><span class="note-title">For You</span><span>جعل سنين عُمري كلها معاك</span><span>وجعل عمرك طويل وسنينك مديده</span><span>احبك sosi</span></span></span></span><span class="flap"></span><span class="pocket"></span><span class="seal">✿</span></button><span class="blow-btn" id="blow-candle" role="button" tabindex="0">انفخي الشمعة sosi</span><span class="kiss" aria-hidden="true">💋</span><div class="hint">TAP TO OPEN</div></div></div>
  </section>
  <button id="replay" type="button">↻ &nbsp; Replay</button>
</main>
<script>
const pages=[document.querySelector('#intro'),document.querySelector('#gift')];
function show(i){pages.forEach((p,n)=>p.classList.toggle('active',n===i));if(i===1)document.body.classList.add('done')}
setTimeout(()=>show(1),5000);
document.querySelector('#envelope').addEventListener('click',e=>{e.currentTarget.classList.toggle('open');e.currentTarget.setAttribute('aria-label',e.currentTarget.classList.contains('open')?'Close the envelope':'Open the envelope')});
const blow=document.querySelector('#blow-candle');const kittyScene=document.querySelector('.kitty-scene');blow.addEventListener('click',e=>{e.stopPropagation();kittyScene.classList.add('blown')});blow.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();e.stopPropagation();kittyScene.classList.add('blown')}});
document.querySelector('#replay').addEventListener('click',()=>{document.body.classList.remove('done');document.querySelector('#envelope').classList.remove('open');document.querySelector('.kitty-scene').classList.remove('blown');show(0);setTimeout(()=>show(1),5000)});</script>
